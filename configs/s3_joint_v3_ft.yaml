# S3-v3 arm A: rec TRAINABLE at lower LR + SynthText replay (evidence: TT-distribution rec is the
#   dark-side bottleneck, word acc ~0.8%; joint FT doubled lit rec 14.6->26.5% in v2 S3).
# Identical to s3_joint_v3_frz.yaml except rec strategy (single-factor A/B).
_base_: base.yaml
data:
  train_anns:
    - data/annotations/totaltext_train_main.jsonl
    - data/annotations/icdar2015_train.jsonl
    - data/annotations/ctw1500_train_det.jsonl
    - data/annotations/synthtext_train.jsonl
  mix_weights: [1.0, 1.0, 0.5, 0.7]      # draw shares: TT 31% / ICDAR 31% / CTW 16% / SynthText 22%
  mix_samples_per_epoch: 4000
  val_ann: data/annotations/totaltext_val.jsonl
train:
  stage: joint
  out_dir: results/v3_archive/s3_joint_v3_ft
  epochs: 40
  batch_size: 8
  lr: 1.0e-4
  lr_rec: 5.0e-5                          # rec gets half LR; replay protects SynthText domain
  amp: true
  val_every: 2
  seed: 0
  freeze_rec: false
  init_det: results/v2_archive/s15_det_lated_v2/last.pt
  init_rec: results/v2_archive/s2_rec_v2/last.pt
