experiment:
  id: R2
  version: 5
  role: identity plus independently public-initialized LoRA TrOCR; 20 minute pilot
recognizer:
  type: trocr
  name: microsoft/trocr-base-printed
  revision: 93450be3f1ed40a930690d951ef3932687cc1892
  local_files_only: true
  adapter: lora
  trainability: lora
  max_len: 64
  lora_r: 16
  lora_alpha: 32
  lora_targets:
  - query
  - value
  - q_proj
  - v_proj
  lora_dropout: 0.05
enhancer:
  type: identity
data:
  root: data
  train_manifest: data/annotations/v5/reading/train.jsonl
  dev_manifest: data/annotations/v5/reading/dev.jsonl
  input_hw:
  - 384
  - 384
  verify_hashes: true
train:
  out_dir: results/v5/reading/R2_lora_short
  batch_size: 4
  seed: 0
  memory_fraction: 0.35
  max_steps: 0
  max_seconds: 1200
  eval_every: 200
  eval_initial: false
  lr: 2.0e-05
  weight_decay: 0.0001
  amp: true
  max_amp_skips: 16
evaluation:
  normalization: raw
  selection_metric: raw_cer
