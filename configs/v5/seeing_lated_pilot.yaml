experiment:
  id: D0b_lated_amp_recovery
  version: 5
  role: engineering sanity only; not official benchmark or full Seeing reproduction
detector:
  type: seeing
  channels: 256
  pretrained: true
  source_root: /opt/dscnet
  kernel_size: 9
data:
  root: data
  provenance: data/annotations/v5/detection/provenance.json
  image_fingerprints: data/annotations/v5/detection/image_fingerprints.jsonl
  train_manifest: data/annotations/v5/detection/latedspot_train.jsonl
  val_manifest: data/annotations/v5/detection/latedspot_val.jsonl
  train_samples: 16
  val_samples: 32
  input_hw: [256, 256]
  feature_stride: 4
  center_shrink: 0.3
train:
  device: cuda:0
  out_dir: results/v5/detection/D0b_lated_amp_recovery
  seed: 0
  memory_fraction: 0.35
  max_seconds: 1200
  max_steps: 500
  batch_size: 2
  val_batch_size: 2
  lr: 1.0e-4
  lr_step_updates: 250
  lr_gamma: 0.1
  amp: true
  max_amp_skips: 16
  grad_clip: 5.0
  eval_every: 25
decoder:
  text_threshold: 0.5
  center_threshold: 0.5
  rectangle_width: 6.0
  sample_step: 3.0
  max_samples: 64
  close_kernel: 3
  min_component_area: 3
  min_polygon_area: 3
  max_detections: 100
