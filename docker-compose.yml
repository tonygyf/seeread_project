# SeeRead — GPU training / evaluation environment
#
# Prerequisites on the host: NVIDIA driver + NVIDIA Container Toolkit.
# Commands (images are only pulled/built when you explicitly run these):
#   docker compose build
#   docker compose run --rm seeread python tests/test_smoke.py
#   docker compose run --rm seeread python tools/legacy/train.py --config configs/legacy/seeread_joint.yaml
#   docker compose run --rm seeread python tools/legacy/eval.py \
#       --config configs/legacy/seeread_joint.yaml --ckpt results/run/last.pt \
#       --ann data/annotations/latedspot_test.jsonl --out results/run/test.json
# On a CPU-only host, remove the `deploy.resources` reservation block below.

name: seeread

services:
  seeread:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.4.1-cuda12.4-cudnn9-runtime}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        USER_UID: ${PUID:-1000}
        USER_GID: ${PGID:-1000}
    image: seeread:latest
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    working_dir: /workspace
    volumes:
      # Datasets and frozen jsonl annotations (see docs/02_dataset_protocol.md)
      - ./data:/workspace/data
      # Checkpoints and metric outputs from tools/legacy/train.py / tools/legacy/eval.py
      - ./results:/workspace/results
      # Cached pretrained weights (TrOCR, ResNet50 backbone) between containers
      - hf-cache:/home/appuser/.cache/huggingface
      - torch-cache:/home/appuser/.cache/torch
      # Live development: uncomment to shadow the baked-in source with the host
      # checkout (configs/, seeread/, tools/, ...)
      # - ./:/workspace
    # Enough shared memory for DataLoader workers (configs/base.yaml: data.workers)
    shm_size: "16g"
    # --- Resource guards: a runaway/leaking run gets OOM-killed or capped
    # inside the container instead of freezing the whole host ---
    # tini as PID 1: reaps orphaned/zombie DataLoader worker processes
    init: true
    # Hard memory ceiling (default 128g ≈ 50% of this host's RAM, includes the
    # 16g /dev/shm above); memswap_limit == mem_limit forbids extra swap, so the
    # cgroup OOM-kills the container instead of dragging the host into swap
    mem_limit: ${MEM_LIMIT:-128g}
    memswap_limit: ${MEM_LIMIT:-128g}
    # Cap tasks (processes+threads) to contain fork bombs; plenty for
    # data.workers=4 with OMP_NUM_THREADS=8 (see .env)
    pids_limit: 512
    # Keep half the host cores free so the machine stays responsive
    cpus: ${CPUS:-64}
    ulimits:
      core:
        soft: 0              # no core dumps filling the disk on crashes
        hard: 0
      nofile:
        soft: 65536
        hard: 65536
    # Bound container logs so long runs cannot fill the disk
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # GPU passthrough — Docker Compose v2 + NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Same default as the Dockerfile quick start; override with any tools/ command
    command: ["python", "tests/test_smoke.py"]

volumes:
  hf-cache:
  torch-cache:
